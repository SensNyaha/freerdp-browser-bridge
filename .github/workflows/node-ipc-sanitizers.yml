name: Node IPC sanitizers
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: node-ipc-sanitizers-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}
jobs:
  addon:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - name: Prepare the sanitizer compiler
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o APT::Update::Error-Mode=any update
          sudo apt-get install --no-install-recommends -y \
            ca-certificates gcc-12 g++-12 make python3 pkg-config xz-utils ninja-build cmake
          g++-12 --version
          fingerprint=$(dpkg-query -W -f='${Package}=${Version}\n' \
            gcc-12 g++-12 libasan8 libubsan1 libstdc++6 libc6 | LC_ALL=C sort | sha256sum | cut -d' ' -f1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      # Cache only the separately installed public Node tool. Bridge objects,
      # runtime session state and release artifacts never enter this cache.
      - uses: actions/cache/restore@v4
        id: node-asan
        with:
          path: build/node-sanitizer-runtime
          key: node-asan-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('tests/fixtures/node-sanitizer/**') }}
      - name: Build pinned Node with ASan on a cold cache
        if: steps.node-asan.outputs.cache-hit != 'true'
        timeout-minutes: 285
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 300 \
            --output build/node-v24.21.0.tar.xz \
            https://nodejs.org/dist/v24.21.0/node-v24.21.0.tar.xz
          sh tests/fixtures/node-sanitizer/build-node.sh \
            "$GITHUB_WORKSPACE/build/node-v24.21.0.tar.xz" \
            "$GITHUB_WORKSPACE/build/node-sanitizer-source" \
            "$GITHUB_WORKSPACE/build/node-sanitizer-runtime"
      - name: Verify the standalone Node baseline on every run
        run: >-
          node scripts/node-sanitizer-baseline.mjs
          "$GITHUB_WORKSPACE/build/node-sanitizer-runtime/bin/node"
          build/current-validation/node-addon
      # Save after the Node controls pass, even if a later bridge test fails.
      # Exact keys only: no fallback to a different compiler or build recipe.
      - uses: actions/cache/save@v4
        if: steps.node-asan.outputs.cache-hit != 'true'
        with:
          path: build/node-sanitizer-runtime
          key: ${{ steps.node-asan.outputs.cache-primary-key }}
      - uses: actions/checkout@v4
        with:
          repository: catchorg/Catch2
          ref: 2b60af89e23d28eefc081bc930831ee9d45ea58b
          path: build/node-ipc-catch2
          persist-credentials: false
      - name: Build the current JS consumers
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Configure a fresh IPC-only sanitizer tree
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset sanitizers -B build/node-ipc-sanitizers \
            -DCMAKE_CXX_COMPILER=g++-12 -DBRIDGE_NODE_IPC=ON \
            -DBRIDGE_NODE_EXECUTABLE="$GITHUB_WORKSPACE/build/node-sanitizer-runtime/bin/node" \
            -DBRIDGE_NODE_INCLUDE_DIR="$GITHUB_WORKSPACE/build/node-sanitizer-runtime/include/node" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DFETCHCONTENT_FULLY_DISCONNECTED=ON \
            -DFETCHCONTENT_SOURCE_DIR_CATCH2="$GITHUB_WORKSPACE/build/node-ipc-catch2"
      - name: Require native and Node fault controls plus actual addon lifecycle
        timeout-minutes: 20
        run: >-
          node scripts/test-node-sanitizer-addon.mjs
          "$GITHUB_WORKSPACE/build/node-sanitizer-runtime/bin/node"
          build/node-ipc-sanitizers build/current-validation/node-addon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-ipc-sanitizer-evidence
          path: build/current-validation/node-addon
          if-no-files-found: ignore
          retention-days: 14
