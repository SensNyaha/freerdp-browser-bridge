name: bundled native runtime
on:
  workflow_dispatch:
jobs:
  bundle:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Linux dependency build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential autoconf autoconf-archive automake libtool libltdl-dev libudev-dev pkg-config nasm perl bison
      - uses: actions/cache@v4
        with:
          path: .tools/vcpkg-cache
          key: bundled-${{ runner.os }}-${{ hashFiles('native/dependencies.json', 'native/vcpkg/**') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:dependencies
      - run: pnpm build:freerdp
      - run: pnpm build:bundled
      - run: pnpm check
        env:
          BRIDGE_TEST_BINARY_DIR: build/bundled
      - run: pnpm test:bundle
      - uses: actions/upload-artifact@v4
        with:
          name: native-runtime-${{ runner.os }}
          path: build/packages/*.*
