name: bundled native runtime
on:
  workflow_dispatch:
jobs:
  bundle:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Prepare pinned Linux GCC 8.3 builder
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          context=build/gcc83-bundled-tools
          test ! -L "$context"
          mkdir -p "$context"
          node scripts/fetch-standalone-input.mjs node-linux-x64-gnu
          cp .tools/standalone-inputs/node-v24.21.0-linux-x64.tar.xz "$context/node.tar.xz"
          cp docker/gcc83-bundled-builder.Dockerfile "$context/Dockerfile"
          cp docker/gcc83-bundled-builder.dockerignore "$context/.dockerignore"
          cp /etc/ssl/certs/ca-certificates.crt "$context/ca-certificates.crt"
          curl --fail --silent --show-error --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 120 --retry 2 --retry-delay 2 --retry-max-time 180 --max-filesize 67108864 --output "$context/cmake.whl" \
            https://files.pythonhosted.org/packages/59/e8/096984b89133681533650b9078c5ed1c5c9b534e869b5487f22d4de1935c/cmake-3.31.6-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
          curl --fail --silent --show-error --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 120 --retry 2 --retry-delay 2 --retry-max-time 180 --max-filesize 67108864 --output "$context/ninja.whl" \
            https://files.pythonhosted.org/packages/eb/7a/455d2877fe6cf99886849c7f9755d897df32eaf3a0fba47b56e615f880f7/ninja-1.11.1.4-py3-none-manylinux_2_12_x86_64.manylinux2010_x86_64.whl
          curl --fail --silent --show-error --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 120 --retry 2 --retry-delay 2 --retry-max-time 180 --max-filesize 8388608 --output "$context/autoconf.tar.xz" \
            https://ftp.gnu.org/gnu/autoconf/autoconf-2.72.tar.xz
          sha256sum --check <<'HASHES'
          1c8b05df0602365da91ee6a3336fe57525b137706c4ab5675498f662ae1dbcec  build/gcc83-bundled-tools/cmake.whl
          096487995473320de7f65d622c3f1d16c3ad174797602218ca8c967f51ec38a0  build/gcc83-bundled-tools/ninja.whl
          ba885c1319578d6c94d46e9b0dceb4014caafe2490e437a0dbca3f270a223f5a  build/gcc83-bundled-tools/autoconf.tar.xz
          HASHES
          docker build --platform linux/amd64 --tag freerdp-bridge-gcc83-bundled-tools "$context"
      - uses: actions/cache@v4
        if: runner.os == 'Windows'
        with:
          path: .tools/vcpkg-cache
          key: bundled-${{ runner.os }}-msvc-${{ hashFiles('native/dependencies.json', 'native/vcpkg/**') }}
      - uses: actions/cache/restore@v4
        if: runner.os == 'Linux'
        id: linux-dependencies
        with:
          path: .tools/vcpkg-cache
          key: bundled-${{ runner.os }}-gcc83-buster-${{ hashFiles('native/dependencies.json', 'native/vcpkg/**', 'docker/gcc83-bundled-builder.*') }}
      - run: pnpm install --frozen-lockfile
        if: runner.os == 'Windows'
      - run: pnpm build:dependencies
        if: runner.os == 'Windows'
      - run: pnpm build:freerdp
        if: runner.os == 'Windows'
      - run: pnpm build:bundled
        if: runner.os == 'Windows'
      - name: Initialize Windows OpenSSL test tool
        if: runner.os == 'Windows'
        shell: powershell
        run: "& 'C:\\Program Files\\Git\\usr\\bin\\openssl.exe' version"
      - run: pnpm check
        if: runner.os == 'Windows'
        env:
          BRIDGE_TEST_BINARY_DIR: build/bundled
          BRIDGE_FILE_TEST_BINARY_DIR: build/bundled
          BRIDGE_MANAGED_DRIVE_TEST_BINARY_DIR: build/bundled
      - name: Build and check Linux native closure at the GCC 8.3 ABI baseline
        if: runner.os == 'Linux'
        env:
          npm_config_store_dir: ${{ github.workspace }}/.tools/pnpm-store
        run: |
          docker run --rm --init --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp/bridge-builder-home --env CC=gcc --env CXX=g++ \
            --env npm_config_store_dir \
            --env VCPKG_MAX_CONCURRENCY=2 --env CMAKE_BUILD_PARALLEL_LEVEL=2 \
            --volume "$PWD:$PWD" --workdir "$PWD" \
            freerdp-bridge-gcc83-bundled-tools sh -eu -c '
              mkdir -p "$HOME"
              test "$(id -u)" -ne 0
              grep -Eq "^CapEff:[[:space:]]+0+$" /proc/self/status
              test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
              test "$(g++ -dumpfullversion)" = 8.3.0
              test "$(node --version)" = v24.21.0
              pnpm install --frozen-lockfile
              pnpm build:dependencies
              pnpm build:freerdp
              pnpm build:bundled
              BRIDGE_TEST_BINARY_DIR=build/bundled \
                BRIDGE_FILE_TEST_BINARY_DIR=build/bundled \
                BRIDGE_MANAGED_DRIVE_TEST_BINARY_DIR=build/bundled \
                LD_LIBRARY_PATH="$PWD/.deps/freerdp-install/lib:$PWD/.deps/installed/x64-linux-bundled/lib" \
                pnpm check
            '
      - name: Save checked Linux dependency binaries
        if: runner.os == 'Linux' && steps.linux-dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .tools/vcpkg-cache
          key: ${{ steps.linux-dependencies.outputs.cache-primary-key }}
      - run: pnpm test:bundle
      - name: Prepare pinned Windows package consumer tooling
        if: runner.os == 'Windows'
        run: npm install --prefix .tools --ignore-scripts --no-audit --no-fund --logs-max=0 pnpm@10.11.0
      - name: Verify installed adapter packages with native file streaming
        run: node scripts/test-managed-files-packages.mjs build/native-stage
      - name: Inventory exact Windows native archive and packaged CRT
        if: runner.os == 'Windows'
        run: |
          node scripts/generate-sbom.mjs
          node scripts/test-sbom-artifacts.mjs
      - name: Prepare native-only clean runtime context
        if: runner.os == 'Linux'
        run: node scripts/prepare-native-runtime-check.mjs
      - name: Verify native archive in restricted clean Linux runtime
        if: runner.os == 'Linux'
        run: |
          docker build -t freerdp-bridge-native-check build/native-runtime-check
          docker run --rm --network none --init --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /run/rdp-bridge-tests:rw,noexec,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=700 freerdp-bridge-native-check
      - name: Assemble production Node runtime and service context
        if: runner.os == 'Linux'
        env:
          npm_config_store_dir: ${{ github.workspace }}/.tools/pnpm-store
        run: |
          node scripts/test-node-clean-build.mjs
          node scripts/package-node-runtime.mjs
          node scripts/generate-sbom.mjs
          node scripts/test-sbom-artifacts.mjs
          node scripts/prepare-service-runtime.mjs
      - name: Verify API and native worker in restricted service runtime
        if: runner.os == 'Linux'
        run: |
          docker build --target runtime -t freerdp-bridge-service build/service-runtime
          docker build --target verification -t freerdp-bridge-service-check build/service-runtime
          docker run --rm --network none --init --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /run/freerdp-bridge:rw,noexec,nosuid,nodev,size=16m,uid=1000,gid=1000,mode=700 freerdp-bridge-service-check
      - name: Inventory final runtime image with hash-pinned Syft
        if: runner.os == 'Linux'
        run: |
          docker image inspect --format 'SBOM_IMAGE_SIZE_BYTES={{.Size}} SBOM_IMAGE_ROOTFS_LAYERS={{len .RootFS.Layers}}' freerdp-bridge-service
          node scripts/scan-runtime-image.mjs freerdp-bridge-service
      - uses: actions/upload-artifact@v4
        with:
          name: native-runtime-${{ runner.os }}
          path: build/packages/*.*
