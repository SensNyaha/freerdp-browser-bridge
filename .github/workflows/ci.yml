name: foundation
on: [push, pull_request]
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:native
      - run: pnpm test:native
      - run: pnpm check
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - run: pnpm install --frozen-lockfile && pnpm build
      - run: cmake --preset sanitizers && cmake --build --preset sanitizers && ctest --preset sanitizers
      - run: pnpm test
        env:
          BRIDGE_TEST_BINARY_DIR: build/sanitizers
      - run: cmake --preset fuzz && cmake --build --preset fuzz && node scripts/seed-fuzz.mjs && build/fuzz/ipc-fuzz build/fuzz/corpus -max_total_time=20
      - run: node scripts/seed-audin-fuzz.mjs && build/fuzz/audin-fuzz build/fuzz/audin-corpus -max_total_time=20
      - run: node scripts/seed-dvc-bounds-fuzz.mjs && build/fuzz/dvc-bounds-fuzz build/fuzz/dvc-bounds-corpus -max_total_time=20
      - run: node scripts/seed-dvc-svc-fuzz.mjs && build/fuzz/dvc-svc-fuzz build/fuzz/dvc-svc-corpus -max_total_time=20
      - run: node scripts/seed-avc-admission-fuzz.mjs && build/fuzz/avc-admission-fuzz build/fuzz/avc-admission-corpus -max_total_time=20
      - run: node scripts/seed-gfx-pdu-admission-fuzz.mjs && build/fuzz/gfx-pdu-admission-fuzz build/fuzz/gfx-pdu-admission-corpus -max_total_time=20
      - run: node scripts/seed-audio-svc-fuzz.mjs && build/fuzz/audio-svc-fuzz build/fuzz/audio-svc-corpus -max_total_time=20
      - run: node scripts/seed-seqpacket-fuzz.mjs && build/fuzz/seqpacket-fuzz build/fuzz/seqpacket-corpus -max_total_time=20 -max_len=32768
      - run: node scripts/seed-clipboard-fuzz.mjs && build/fuzz/clipboard-text-fuzz build/fuzz/clipboard-corpus -max_total_time=20 -max_len=16384 -rss_limit_mb=512
