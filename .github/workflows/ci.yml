name: foundation
on: [push, pull_request]
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: g++-12
          - os: ubuntu-24.04
            compiler: g++
          - os: windows-latest
            compiler: cl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install the GCC 12 baseline
        if: runner.os == 'Linux' && matrix.compiler == 'g++-12'
        run: sudo apt-get update && sudo apt-get install -y g++-12
      - run: pnpm install --frozen-lockfile
      - run: cmake --preset foundation -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DBRIDGE_NODE_IPC=${{ runner.os == 'Linux' && 'ON' || 'OFF' }}
      - run: pnpm build:native
      - run: pnpm test:native
      - run: pnpm build
      - name: Actual LocalService preserves owner and sibling lifecycles
        if: runner.os == 'Windows'
        run: node --test tests/integration/cross-principal-isolation.test.mjs
        env:
          BRIDGE_TEST_BINARY_DIR: build/foundation
          BRIDGE_CROSS_PRINCIPAL_TEST: '1'
      - name: Actual distinct Linux UIDs preserve owner and sibling lifecycles
        if: runner.os == 'Linux'
        run: sudo env BRIDGE_CROSS_PRINCIPAL_TEST=1 BRIDGE_TEST_BINARY_DIR="$GITHUB_WORKSPACE/build/foundation" "$(command -v node)" --test tests/integration/cross-principal-isolation.test.mjs
      - run: pnpm check
        env:
          BRIDGE_TEST_BINARY_DIR: build/foundation
          BRIDGE_FILE_TEST_BINARY_DIR: build/foundation
      - name: Actual HTTP disk full and quota refund on bounded tmpfs
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          full_root="$(mktemp -d "${RUNNER_TEMP}/bridge-http-full.XXXXXX")"
          if ! sudo mount -t tmpfs -o "size=1m,uid=$(id -u),gid=$(id -g),mode=700,nodev,nosuid,noexec" bridge-http-full "$full_root"; then
            rmdir -- "$full_root"
            exit 1
          fi
          trap 'sudo umount -- "$full_root"; rmdir -- "$full_root"' EXIT
          BRIDGE_FILE_TEST_FULL_ROOT="$full_root" \
            BRIDGE_FILE_TEST_BINARY_DIR="$GITHUB_WORKSPACE/build/foundation" \
            node --test --test-concurrency=1 tests/integration/files-disk-full.test.mjs
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - name: Install baseline GCC and Clang sanitizer tools
        run: sudo apt-get -o APT::Update::Error-Mode=any update && sudo apt-get install -y g++-12 clang-18 libclang-rt-18-dev
      - run: pnpm install --frozen-lockfile && pnpm build
      - run: cmake --preset sanitizers -DCMAKE_CXX_COMPILER=g++-12 && cmake --build --preset sanitizers && ctest --preset sanitizers
      - run: pnpm test
        env:
          BRIDGE_TEST_BINARY_DIR: build/sanitizers
      - run: cmake --preset fuzz -DCMAKE_CXX_COMPILER=clang++-18 && cmake --build --preset fuzz && node scripts/seed-fuzz.mjs && build/fuzz/ipc-fuzz build/fuzz/corpus -max_total_time=20 -timeout=5 -rss_limit_mb=512 -max_len=65600
      - run: node scripts/seed-audin-fuzz.mjs && build/fuzz/audin-fuzz build/fuzz/audin-corpus -max_total_time=20 -timeout=5 -rss_limit_mb=512 -max_len=16384
      - run: node scripts/seed-dvc-bounds-fuzz.mjs && build/fuzz/dvc-bounds-fuzz build/fuzz/dvc-bounds-corpus -max_total_time=20 -timeout=5 -rss_limit_mb=512 -max_len=16384
      - run: node scripts/seed-dvc-svc-fuzz.mjs && build/fuzz/dvc-svc-fuzz build/fuzz/dvc-svc-corpus -max_total_time=20 -timeout=5 -rss_limit_mb=512 -max_len=16384
      - run: node scripts/seed-avc-admission-fuzz.mjs && build/fuzz/avc-admission-fuzz build/fuzz/avc-admission-corpus -max_total_time=20 -timeout=5 -rss_limit_mb=512 -max_len=16384
      - run: node scripts/seed-gfx-pdu-admission-fuzz.mjs && build/fuzz/gfx-pdu-admission-fuzz build/fuzz/gfx-pdu-admission-corpus -max_total_time=20 -timeout=5 -rss_limit_mb=512 -max_len=16384
      - run: node scripts/seed-audio-svc-fuzz.mjs && build/fuzz/audio-svc-fuzz build/fuzz/audio-svc-corpus -max_total_time=20 -timeout=5 -rss_limit_mb=512 -max_len=16384
      - run: node scripts/seed-seqpacket-fuzz.mjs && build/fuzz/seqpacket-fuzz build/fuzz/seqpacket-corpus -max_total_time=20 -timeout=5 -rss_limit_mb=512 -max_len=32768
      - run: node scripts/seed-clipboard-fuzz.mjs && build/fuzz/clipboard-text-fuzz build/fuzz/clipboard-corpus -max_total_time=20 -timeout=5 -max_len=16384 -rss_limit_mb=512
      - run: node scripts/seed-clipboard-html-fuzz.mjs && build/fuzz/clipboard-html-fuzz build/fuzz/clipboard-html-corpus -max_total_time=20 -timeout=5 -max_len=16384 -rss_limit_mb=512
      - run: node scripts/seed-clipboard-image-fuzz.mjs && build/fuzz/clipboard-image-fuzz build/fuzz/clipboard-image-corpus -max_total_time=20 -timeout=5 -max_len=16384 -rss_limit_mb=512
      - run: node scripts/seed-clipboard-ingress-fuzz.mjs && build/fuzz/clipboard-ingress-fuzz build/fuzz/clipboard-ingress-corpus -max_total_time=20 -timeout=5 -max_len=16384 -rss_limit_mb=512
      - run: node scripts/seed-clipboard-wire-fuzz.mjs && build/fuzz/clipboard-wire-fuzz build/fuzz/clipboard-wire-corpus -max_total_time=20 -timeout=5 -max_len=16384 -rss_limit_mb=512
