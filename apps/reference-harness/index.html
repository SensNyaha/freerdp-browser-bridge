<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FreeRDP Bridge — диагностический просмотр</title>
    <style>
      body {
        margin: 24px;
        font:
          16px system-ui,
          sans-serif;
        background: #111827;
        color: #e5e7eb;
      }
      canvas {
        display: block;
        max-width: 100%;
        height: auto;
        background: #000;
        margin-top: 16px;
      }
      button {
        padding: 8px 12px;
        margin-right: 8px;
      }
      #fingerprint {
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <h1>FreeRDP Bridge</h1>
    <p id="status" role="status">Ожидание сессии</p>
    <section id="certificate" hidden>
      <p>Сертификат сервера требует решения для этой сессии.</p>
      <p id="fingerprint"></p>
      <button id="accept">Принять для этой сессии</button>
      <button id="reject">Отклонить</button>
    </section>
    <p>
      Щёлкните по рабочему столу для ввода. При выходе из окна нажатия
      освобождаются.
    </p>
    <canvas id="desktop" tabindex="0" aria-label="Рабочий стол RDP"></canvas>
    <form id="text-input" autocomplete="off">
      <label for="unicode-text">Текст Unicode / IME</label>
      <textarea
        id="unicode-text"
        maxlength="256"
        rows="2"
        autocomplete="off"
        spellcheck="false"
      ></textarea>
      <button disabled>Отправить текст</button>
      <span role="status"></span>
      <p>
        Введите текст здесь, завершите IME и отправьте его в активное поле
        удалённого рабочего стола.
      </p>
    </form>
    <form id="resize">
      <label
        >Ширина
        <input
          id="resize-width"
          type="number"
          min="200"
          max="3840"
          step="2"
          value="1280"
          required
      /></label>
      <label
        >Высота
        <input
          id="resize-height"
          type="number"
          min="200"
          max="2160"
          step="2"
          value="720"
          required
      /></label>
      <button id="resize-button" disabled>Изменить разрешение</button>
      <span id="resize-status" role="status">Ожидание параметров дисплея</span>
    </form>
    <script type="module" src="./viewer.js"></script>
  </body>
</html>
