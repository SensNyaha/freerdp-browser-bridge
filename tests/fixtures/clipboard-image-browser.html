<!doctype html>
<meta charset="utf-8" />
<title>Owned image transfer fixture</title>
<script type="module">
  import { ClipboardClient } from '/clipboard-client.js';
  let ws,
    client,
    timer,
    connected = false,
    sequence = 0,
    commands = 0,
    failures = 0,
    lastItem;
  window.localClipboardCalls = 0;
  Object.defineProperty(navigator, 'clipboard', {
    configurable: true,
    value: Object.fromEntries(
      ['read', 'write', 'readText', 'writeText'].map((name) => [
        name,
        () => {
          ++window.localClipboardCalls;
          throw new Error('Unexpected OS clipboard access');
        },
      ]),
    ),
  });
  const clear = () => {
    lastItem?.rgba.fill(0);
    lastItem = undefined;
  };
  const dispose = () => {
    clear();
    clearTimeout(timer);
    client?.dispose();
    ws?.close();
  };
  const changed = () => {
    clearTimeout(timer);
    const deadline = client.nextDeadline;
    if (deadline !== undefined)
      timer = setTimeout(
        () => client.service(),
        Math.max(1, Math.ceil(deadline - performance.now())),
      );
  };
  window.fixture = {
    attach(created) {
      ws = new WebSocket(
        'ws://' +
          location.host +
          '/v1/sessions/' +
          created.sessionId +
          '/control?token=' +
          encodeURIComponent(created.attach.control.token),
        ['freerdp-bridge-v1'],
      );
      ws.binaryType = 'arraybuffer';
      client = new ClipboardClient({
        authorized: () => connected && ws.readyState === WebSocket.OPEN,
        bufferedAmount: () => ws.bufferedAmount,
        changed,
        failed: () => {
          ++failures;
          dispose();
        },
        sendControl(type, data) {
          const seq = sequence++;
          ++commands;
          ws.send(JSON.stringify({ v: 1, type, seq, ts: Date.now(), data }));
          return seq;
        },
        sendBinary(bytes) {
          ws.send(bytes);
          return true;
        },
      });
      ws.addEventListener('message', (event) => {
        if (event.data instanceof ArrayBuffer) {
          client.binary(event.data);
          return;
        }
        const message = JSON.parse(event.data);
        if (message.type === 'session.state') {
          connected = message.data.state === 'connected';
          client.service();
        } else client.message(message.type, message.data);
      });
      ws.addEventListener('close', () => {
        connected = false;
        client.dispose();
        clearTimeout(timer);
        clear();
      });
    },
    get snapshot() {
      return client?.snapshot;
    },
    get commands() {
      return commands;
    },
    get failures() {
      return failures;
    },
    upload() {
      const rgba = new Uint8Array(40000);
      for (let n = 0; n < rgba.length; n++) rgba[n] = n % 251;
      const result = client.setImage({ width: 100, height: 100, rgba });
      rgba.fill(0);
      return result;
    },
    invalid() {
      return client.setImage({
        width: 100,
        height: 101,
        rgba: new Uint8Array(40000),
      });
    },
    async read() {
      const result = await client.readImage();
      if (result.status !== 'accepted') return { status: result.status };
      clear();
      lastItem = result.item;
      let exact =
        lastItem.width === 100 &&
        lastItem.height === 100 &&
        lastItem.rgba.length === 40000;
      for (let n = 0; n < lastItem.rgba.length; n++)
        exact &&= lastItem.rgba[n] === n % 251;
      return { status: 'accepted', exact };
    },
    clear() {
      const rgba = lastItem?.rgba;
      clear();
      return !rgba || rgba.every((byte) => byte === 0);
    },
    dispose,
  };
</script>
